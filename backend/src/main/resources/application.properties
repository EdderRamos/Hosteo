spring.application.name=backend
spring.config.import=optional:file:./.env[.properties]

# PostgreSQL: configurar credenciales mediante variables de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hosteo}
spring.datasource.username=${DB_USERNAME:hosteo}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Documentación de la API.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# Exponer únicamente el estado de salud.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
