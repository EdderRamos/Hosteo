spring.application.name=backend
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hosteo}
spring.datasource.username=${DB_USERNAME:hosteo}
spring.datasource.password=${DB_PASSWORD:}
# Bound each application instance's connection use and fail before the frontend timeout.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
app.bootstrap.roles=${BOOTSTRAP_ROLES:false}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=hosteo-api
security.jwt.ttl=PT30M
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
