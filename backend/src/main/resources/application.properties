spring.application.name=backend
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hosteo}
spring.datasource.username=${DB_USERNAME:hosteo}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
app.bootstrap.roles=${BOOTSTRAP_ROLES:false}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=hosteo-api
security.jwt.ttl=PT30M
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
